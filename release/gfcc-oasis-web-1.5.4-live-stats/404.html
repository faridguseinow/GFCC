<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GFCC</title>
    <script>
      (function () {
        var redirectPath =
          window.location.pathname +
          window.location.search +
          window.location.hash;

        try {
          sessionStorage.setItem("gfcc_spa_redirect", redirectPath);
        } catch (error) {
          // ignore storage errors
        }

        window.location.replace("/");
      })();
    </script>
  </head>
  <body></body>
</html>
